<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
body{margin:0;background:var(--bg-app)}
.cv{position:relative;width:960px;height:300px;overflow:hidden}
.cv svg{position:absolute;left:0;top:0}
.nm{position:absolute;left:32px;bottom:28px;width:420px}
.nm h1{margin:0;font:700 96px/.92 var(--font-sans);color:var(--brown);letter-spacing:-.02em}
.nm p{margin:10px 0 0;font:400 14px/20px var(--font-sans);color:var(--text-2)}
.pr{fill:var(--primary)}.bw{fill:var(--brown)}.wn{fill:var(--warning)}.dg{fill:var(--danger)}.nt{fill:var(--stage-negociacion)}.sp{rx:var(--radius-sm)}.sh{stroke:var(--border-strong);stroke-width:2}
</style></head><body><div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Lomos de libros sobre dos estantes">
<!-- blocks: primary x brown x warning x danger x stage-negociacion, anchos 24/32/48px (space-4 a 48), alturas 72-132px
     arrangement: dos estantes; lomos de alturas desiguales apoyados en cada balda, el verde y el marrón dominan
     pattern: lomos de libro (motivo literal de librería) y dos baldas; elegido porque el negocio es una librería-cafetería
     scales: rx = radius-sm (6px), baldas con border-strong, paso de 8px entre lomos -->
<g><line class="sh" x1="496" y1="136" x2="944" y2="136"/><line class="sh" x1="496" y1="268" x2="944" y2="268"/></g>
<g><rect class="sp pr" x="504" y="36" width="48" height="100"/><rect class="sp bw" x="560" y="56" width="32" height="80"/><rect class="sp wn" x="600" y="28" width="24" height="108"/><rect class="sp nt" x="632" y="48" width="48" height="88"/><rect class="sp pr" x="688" y="64" width="32" height="72"/><rect class="sp dg" x="728" y="76" width="24" height="60"/><rect class="sp bw" x="760" y="32" width="48" height="104"/><rect class="sp pr" x="816" y="52" width="24" height="84"/></g>
<g><rect class="sp bw" x="504" y="148" width="32" height="120"/><rect class="sp pr" x="544" y="136" width="48" height="132"/><rect class="sp nt" x="600" y="164" width="24" height="104"/><rect class="sp wn" x="632" y="152" width="32" height="116"/><rect class="sp pr" x="672" y="140" width="24" height="128"/><rect class="sp bw" x="704" y="160" width="48" height="108"/><rect class="sp pr" x="760" y="172" width="32" height="96"/><rect class="sp nt" x="800" y="144" width="48" height="124"/></g>
</svg>
<div class="nm"><h1>CRM-123</h1><p>El CRM de una librería-cafetería.</p></div>
</div></body></html>
